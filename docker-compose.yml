services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: novahis
      POSTGRES_USER: novahis
      POSTGRES_PASSWORD: novahis
    ports:
      - "5432:5432"
    volumes:
      - novahis_db:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://novahis:novahis@db:5432/novahis
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret}
      JWT_ALGORITHM: HS256
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  novahis_db:
